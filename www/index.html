<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{height:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Coach Tennis</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: mobile-first app — sticky top bar, scroll area, fixed bottom tab bar; court drawn as fixed-palette SVG in both themes */
:root{
  --bg:#f4f6f2; --surface:#ffffff; --surface2:#eef2ec; --fg:#152018; --muted:#5e6d62;
  --line:#e0e6dd; --accent:#2f8f5b; --accent-ink:#ffffff; --clay:#df6d38; --gold:#caa23a;
  --shadow:0 1px 3px rgba(20,40,25,.07),0 8px 24px rgba(20,40,25,.06);
  --r:16px; --r-sm:11px;
  /* category colours (stable across themes) */
  --c-cd:#e07d33; --c-rev:#9b57cf; --c-feed:#d7ad2e; --c-mv:#3f84cf; --c-marc:#d9534b;
  --c-geste:#df6d38; --c-prep:#3f84cf; --c-appui:#2f8f5b; --c-depl:#9b57cf;
  --disp:"Space Grotesk",system-ui,sans-serif; --body:"Inter",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1511; --surface:#18201a; --surface2:#1f2922; --fg:#e9f1e9; --muted:#9db0a2;
  --line:#28332b; --accent:#4cc080; --accent-ink:#07130c; --clay:#f0885a; --gold:#e3c45c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1511; --surface:#18201a; --surface2:#1f2922; --fg:#e9f1e9; --muted:#9db0a2;
  --line:#28332b; --accent:#4cc080; --accent-ink:#07130c; --clay:#f0885a; --gold:#e3c45c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);margin:0;line-height:1.5;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.disp{font-family:var(--disp);letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer}
.app{min-height:100%;display:flex;flex-direction:column}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);
  border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:21}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--disp);font-weight:700;font-size:1.05rem}
.brand .logo{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:17px;flex:none}
.spacer{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;height:36px;min-width:36px;padding:0 9px;font-size:.8rem;font-weight:600;display:inline-flex;align-items:center;gap:5px;justify-content:center}
.iconbtn.lang{font-family:var(--disp)}
.iconbtn:active{transform:scale(.95)}

/* main scroll */
main{flex:1;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:16px;padding-bottom:104px;max-width:640px;margin:0 auto;width:100%}
.view{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view,.sheet-in{animation:none}}

/* bottom nav */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;
  padding-top:7px;padding-bottom:calc(7px + env(safe-area-inset-bottom,0px));
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.66rem;font-weight:600;padding:3px 10px;border-radius:10px;flex:1;max-width:120px}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8}
.tab.active{color:var(--accent)}

/* pieces */
.eyebrow{font-family:var(--disp);text-transform:uppercase;letter-spacing:.09em;font-size:.68rem;font-weight:700;color:var(--accent)}
.h-lead{font-size:1.5rem;font-weight:700;margin:4px 0 2px;text-wrap:balance}
.lead-sub{color:var(--muted);font-size:.92rem;margin-bottom:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.sec-title{font-family:var(--disp);font-weight:700;font-size:1.05rem;margin:22px 0 10px;display:flex;align-items:center;gap:8px}

/* players */
.players{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.86rem;display:inline-flex;align-items:center;gap:7px}
.chip .av{width:22px;height:22px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:.72rem;font-weight:700;color:var(--accent)}
.chip.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.sel .av{background:rgba(255,255,255,.25);color:var(--accent-ink)}
.chip.add{border-style:dashed;color:var(--muted)}

/* key points */
.keypts{display:grid;gap:10px;margin:6px 0 2px}
.kp{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--line)}
.kp .n{width:30px;height:30px;border-radius:9px;background:var(--surface2);color:var(--accent);font-family:var(--disp);font-weight:700;display:grid;place-items:center;flex:none}
.kp b{font-weight:700}
.kp .d{font-size:.9rem;color:var(--fg)}
.kp .d small{color:var(--muted)}

/* session cards */
.scards{display:grid;gap:12px}
.scard{display:flex;align-items:stretch;gap:0;padding:0;overflow:hidden;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);width:100%}
.scard .stripe{width:7px;flex:none}
.scard .in{padding:15px 15px 15px 14px;flex:1;min-width:0}
.scard .tag{font-family:var(--disp);font-weight:700;font-size:.72rem;color:var(--muted);letter-spacing:.04em}
.scard h3{margin:3px 0 4px;font-size:1.12rem;font-weight:700}
.scard .meta{font-size:.82rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.scard .meta b{color:var(--fg);font-weight:600}
.scard .go{align-self:center;padding-right:14px;color:var(--muted)}
.scard:active{transform:scale(.99)}

/* session runner */
.runhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.backb{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;height:38px;width:38px;display:grid;place-items:center;flex:none}
.runhead .rt{min-width:0}
.runhead .rt .tag{font-family:var(--disp);font-weight:700;font-size:.7rem;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.runhead .rt h2{margin:1px 0 0;font-size:1.12rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:6px;margin:0 0 14px}
.dots .dot{height:6px;border-radius:3px;flex:1;background:var(--surface2);transition:background .2s}
.dots .dot.done{background:var(--accent)}
.dots .dot.cur{background:var(--clay)}

.exhead{display:flex;align-items:flex-start;gap:10px;margin-bottom:4px}
.exhead h2{font-size:1.28rem;font-weight:700;margin:0;text-wrap:balance;flex:1}
.pill{font-family:var(--disp);font-weight:600;font-size:.72rem;padding:5px 10px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.warm-badge{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:700;color:var(--gold);font-family:var(--disp);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}

/* court */
.courtwrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;box-shadow:var(--shadow);margin:6px 0 4px}
.courtwrap svg{display:block;width:100%;height:auto;max-width:300px;margin:0 auto;border-radius:10px}
.caption{font-size:.82rem;color:var(--muted);text-align:center;padding:4px 8px 2px;font-style:italic}

/* timer + score */
.rowtools{display:flex;gap:10px;margin:12px 0}
.tool{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 12px;box-shadow:var(--shadow)}
.tool .lbl{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-family:var(--disp)}
.timer-val{font-family:var(--disp);font-weight:700;font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:2px}
.timer-val .tgt{font-size:.78rem;color:var(--muted);font-weight:600}
.timer-btns{display:flex;gap:6px;margin-top:8px}
.tbtn{flex:1;border:1px solid var(--line);background:var(--surface2);color:var(--fg);border-radius:9px;padding:7px;font-weight:600;font-size:.8rem}
.tbtn.run{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.score-ctl{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.score-val{font-family:var(--disp);font-weight:700;font-size:1.7rem;font-variant-numeric:tabular-nums}
.sbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);font-size:1.3rem;font-weight:700;display:grid;place-items:center}
.sbtn.plus{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* detail sections */
.detail{margin-top:6px}
.dsec{padding:13px 2px;border-top:1px solid var(--line)}
.dsec .dlab{font-family:var(--disp);font-weight:700;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);display:flex;align-items:center;gap:7px;margin-bottom:7px}
.dsec.foc .dlab{color:var(--clay)}
.dsec p{margin:0;font-size:.94rem}
.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:grid;gap:9px}
.steps li{display:flex;gap:11px;font-size:.94rem;align-items:flex-start}
.steps li::before{counter-increment:s;content:counter(s);flex:none;width:23px;height:23px;border-radius:7px;background:var(--surface2);color:var(--accent);font-family:var(--disp);font-weight:700;font-size:.8rem;display:grid;place-items:center;margin-top:1px}
.focus{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.focus li{display:flex;gap:9px;font-size:.94rem;align-items:flex-start}
.focus li::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;background:var(--clay);margin-top:7px}

.navex{display:flex;gap:10px;margin:18px 0 4px}
.navex button{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:var(--r-sm);padding:14px;font-weight:700;font-family:var(--disp);display:flex;align-items:center;justify-content:center;gap:8px}
.navex button.prim{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.navex button:disabled{opacity:.4}

/* FAB */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:30;
  background:var(--clay);color:#fff;border:0;border-radius:999px;padding:14px 20px;font-family:var(--disp);font-weight:700;font-size:.95rem;
  box-shadow:0 6px 20px rgba(200,90,40,.4);display:inline-flex;align-items:center;gap:8px}
.fab:active{transform:scale(.96)}
.fab svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2}

/* sheet / modal */
.scrim{position:fixed;inset:0;background:rgba(10,18,12,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;border:1px solid var(--line);border-bottom:0;
  padding:16px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.25);
  max-height:88vh;overflow:auto}
.sheet-in{animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 3px;font-size:1.2rem}
.sheet .sub{color:var(--muted);font-size:.88rem;margin-bottom:14px}
.faultgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.faultbtn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:var(--r-sm);padding:14px 12px;text-align:left;border-left-width:5px}
.faultbtn .ft{font-family:var(--disp);font-weight:700;font-size:1rem}
.faultbtn .fd{font-size:.76rem;color:var(--muted);margin-top:2px}
.faultbtn .fc{font-size:.74rem;color:var(--accent);font-weight:600;margin-top:6px}
.faultbtn:active{transform:scale(.97)}

/* defi result */
.defi-res{text-align:center}
.defi-res .cat{font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:.76rem}
.defi-res .big{font-family:var(--disp);font-weight:700;font-size:2rem;margin:8px 0 4px;text-wrap:balance}
.defi-res .how{background:var(--surface2);border-radius:var(--r-sm);padding:13px 15px;font-size:.92rem;text-align:left;margin:12px 0}
.defi-res .varied{font-size:.76rem;color:var(--muted);margin-bottom:10px}
.btn-wide{width:100%;border:0;background:var(--accent);color:var(--accent-ink);border-radius:var(--r-sm);padding:15px;font-family:var(--disp);font-weight:700;font-size:1rem}
.btn-ghost{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:var(--r-sm);padding:13px;font-family:var(--disp);font-weight:600;margin-top:9px}
.reroll{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:9px 15px;font-weight:600;font-size:.85rem;margin-bottom:6px}

/* defis reference */
.explain{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px;box-shadow:var(--shadow);margin:4px 0 6px}
.explain b{color:var(--accent)}
.dcard{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);border-left-width:6px}
.dcard .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.dcard .nm{font-family:var(--disp);font-weight:700;font-size:1.05rem}
.dcard .fx{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:999px}
.dcard .fx.fixed{background:rgba(63,132,207,.14);color:var(--c-mv)}
.dcard .fx.var{background:rgba(155,87,207,.14);color:var(--c-depl)}
.dcard .trig{font-size:.82rem;color:var(--muted);margin:2px 0 8px}
.dcard .res{font-family:var(--disp);font-weight:700;font-size:1.05rem;margin-bottom:6px}
.dcard ul{margin:4px 0 0;padding-left:18px;font-size:.88rem;color:var(--fg)}
.dcard ul li{margin:3px 0}
.dcard p.how{font-size:.88rem;margin:2px 0 0}
.golden{background:linear-gradient(180deg,color-mix(in srgb,var(--gold) 14%,var(--surface)),var(--surface));
  border:1px solid color-mix(in srgb,var(--gold) 40%,var(--line));border-radius:var(--r);padding:15px;margin-top:6px}
.golden h3{margin:0 0 9px;font-size:1rem;color:var(--fg)}
.golden li{font-size:.9rem;margin:6px 0}

/* progress */
.stat-row{display:flex;gap:10px;margin-bottom:14px}
.stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:13px;text-align:center;box-shadow:var(--shadow)}
.stat .v{font-family:var(--disp);font-weight:700;font-size:1.7rem}
.stat .l{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-top:2px}
.hist{display:grid;gap:10px}
.hitem{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 14px;box-shadow:var(--shadow)}
.hitem .ht{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.hitem .hs{font-family:var(--disp);font-weight:700;font-size:1rem}
.hitem .hd{font-size:.76rem;color:var(--muted)}
.hitem .hf{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.fault-tag{font-size:.72rem;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:.9rem}
.empty svg{width:46px;height:46px;stroke:var(--line);fill:none;stroke-width:1.5;margin-bottom:10px}

/* bilan */
.bilan-hd{text-align:center;padding:10px 0 4px}
.bilan-hd .tro{font-size:2.4rem}
.bilan-hd h2{font-size:1.5rem;margin:4px 0 2px}
.bilan-hd p{color:var(--muted);font-size:.9rem;margin:0}
.bsec{margin-top:18px}
.bsec h3{font-family:var(--disp);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin:0 0 9px}
.fault-bars{display:grid;gap:9px}
.fbar{display:flex;align-items:center;gap:10px}
.fbar .nm{width:98px;font-size:.84rem;font-weight:600;flex:none}
.fbar .track{flex:1;height:22px;background:var(--surface2);border-radius:7px;overflow:hidden}
.fbar .fill{height:100%;border-radius:7px;min-width:3px}
.fbar .ct{width:26px;text-align:right;font-family:var(--disp);font-weight:700;font-variant-numeric:tabular-nums}
.exscores{display:grid;gap:7px}
.exscore{display:flex;justify-content:space-between;font-size:.9rem;padding:9px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.exscore b{font-family:var(--disp)}
.note{font-size:.84rem;color:var(--muted);text-align:center;margin-top:14px}

.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
input.name{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:12px;font-size:1rem;margin:4px 0 12px}

/* ===== v2: animated background ===== */
#bg{position:fixed;inset:0;z-index:0;width:100%;height:100%;pointer-events:none}
.app{position:relative;z-index:1}
main{background:transparent}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:20px;padding:18px;margin-bottom:16px;color:#fff;
  background:linear-gradient(135deg,#1f7a4d 0%,#2f8f5b 45%,#3f84cf 120%);box-shadow:0 10px 30px rgba(20,60,35,.28)}
.hero::after{content:"🎾";position:absolute;right:-10px;bottom:-18px;font-size:92px;opacity:.16;transform:rotate(-12deg)}
.hero .hi{font-family:var(--disp);font-weight:700;font-size:1.5rem;line-height:1.1;text-wrap:balance;position:relative}
.hero .hsub{opacity:.92;font-size:.9rem;margin-top:4px;position:relative}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 6px}
.qbtn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:var(--r);padding:15px 13px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:7px}
.qbtn .qi{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:19px}
.qbtn .qt{font-family:var(--disp);font-weight:700;font-size:1rem}
.qbtn .qd{font-size:.76rem;color:var(--muted)}
.qbtn:active{transform:scale(.98)}
.qbtn.wide{grid-column:1/-1;flex-direction:row;align-items:center}
.qbtn.wide .qi{flex:none}

/* segmented */
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:4px;gap:4px;margin-bottom:16px}
.seg button{flex:1;border:0;background:none;color:var(--muted);font-family:var(--disp);font-weight:600;font-size:.9rem;padding:9px;border-radius:9px}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

/* filter chips */
.filters{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{display:none}
.fchip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:7px 13px;font-weight:600;font-size:.82rem;white-space:nowrap;flex:none}
.fchip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* drill cards */
.drill{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.drill .dcat{font-family:var(--disp);font-weight:700;font-size:.64rem;text-transform:uppercase;letter-spacing:.05em;padding:4px 9px;border-radius:999px;flex:none}
.drill .dinfo{flex:1;min-width:0}
.drill h3{margin:0 0 3px;font-size:1.05rem;font-weight:700}
.drill .dgoal{font-size:.84rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.drill .dmeta{display:flex;gap:8px;align-items:center;margin-top:7px;font-size:.72rem;color:var(--muted)}
.drill .fav{background:none;border:0;font-size:1.15rem;flex:none;line-height:1;padding:2px;color:var(--gold)}
.lvl{font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.vidtag{display:inline-flex;align-items:center;gap:3px;color:var(--accent);font-weight:600}

/* detail sheet */
.dsheet h2{font-size:1.3rem;margin:0 0 4px;text-wrap:balance}
.dsheet .meta2{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}

/* match */
.scorebd{background:linear-gradient(135deg,#17241c,#1d3a2a);border-radius:var(--r);padding:16px;color:#fff;box-shadow:var(--shadow);margin-bottom:14px}
.scorebd .srow{display:flex;align-items:center;justify-content:space-between;padding:7px 0}
.scorebd .srow+.srow{border-top:1px solid rgba(255,255,255,.12)}
.scorebd .pn{font-family:var(--disp);font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:8px}
.scorebd .serve{width:9px;height:9px;border-radius:50%;background:#e9e24a;box-shadow:0 0 8px #e9e24a}
.scorebd .sets{display:flex;gap:10px;align-items:center}
.scorebd .sc{font-family:var(--disp);font-weight:700;font-size:1.15rem;min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
.scorebd .cur{background:var(--clay);border-radius:8px;padding:2px 10px;min-width:40px}
.gametag{text-align:center;font-family:var(--disp);font-weight:700;font-size:.8rem;color:#cfe8d8;margin-top:6px;opacity:.9}
.shotsel{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.shotsel .sh{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:7px 12px;font-weight:600;font-size:.8rem}
.shotsel .sh.on{background:var(--c-mv);color:#fff;border-color:var(--c-mv)}
.outcomes{display:grid;gap:9px}
.ocol{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.obtn{border:0;border-radius:var(--r-sm);padding:13px 10px;font-family:var(--disp);font-weight:700;font-size:.9rem;color:#fff;text-align:center;line-height:1.15}
.obtn small{display:block;font-size:.68rem;font-weight:600;opacity:.9;margin-top:2px}
.obtn.win{background:#2f8f5b}.obtn.ace{background:#1f7a4d}.obtn.oerr{background:#5a8f6f}
.obtn.owin{background:#d9534b}.obtn.ue{background:#c0533f}.obtn.df{background:#9c4636}
.matchbar{display:flex;gap:8px;margin-top:12px}
.matchbar button{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:var(--r-sm);padding:12px;font-weight:600;font-family:var(--disp)}
.matchbar button.end{background:var(--clay);color:#fff;border-color:var(--clay)}

/* stat charts */
.donutwrap{display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.donutwrap svg{flex:none}
.legend{display:grid;gap:6px;font-size:.84rem}
.legend .lg{display:flex;align-items:center;gap:8px}
.legend .sw{width:11px;height:11px;border-radius:3px;flex:none}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat2{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:13px;box-shadow:var(--shadow)}
.stat2 .v{font-family:var(--disp);font-weight:700;font-size:1.6rem;font-variant-numeric:tabular-nums}
.stat2 .l{font-size:.72rem;color:var(--muted);font-weight:600}
.cmp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.cmprow{margin:10px 0}
.cmprow .ct{display:flex;justify-content:space-between;font-size:.84rem;font-weight:600;margin-bottom:4px}
.cmprow .bar{display:flex;height:16px;border-radius:6px;overflow:hidden;background:var(--surface2)}
.cmprow .bl{background:var(--c-mv)}.cmprow .br{background:var(--c-marc)}

/* video grid */
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vcard{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);overflow:hidden;box-shadow:var(--shadow);text-align:left}
.vcard .vthumb{width:100%;aspect-ratio:16/10;object-fit:cover;background:#000;display:block}
.vcard .vph{width:100%;aspect-ratio:16/10;display:grid;place-items:center;background:var(--surface2);font-size:26px;color:var(--muted)}
.vcard .vb{padding:9px 10px}
.vcard .vn{font-weight:600;font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vcard .vd{font-size:.68rem;color:var(--muted);margin-top:2px}
.vimport{border:2px dashed var(--line);background:var(--surface);border-radius:var(--r-sm);display:grid;place-items:center;aspect-ratio:16/10;color:var(--muted);font-weight:600;font-size:.84rem;gap:4px;text-align:center;padding:8px}
.playerwrap video{width:100%;border-radius:12px;background:#000;max-height:60vh}
</style>
