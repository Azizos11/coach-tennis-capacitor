const BIBLIO=[{"id": "t2_02", "coll": "2j", "title": "Warm-Up Short Court", "text": "his is one of the drills that are just great to begin tennis practice by warming up the body and getting a good feel for the racquet/ball control.\nBoth players are positioned behind the service line, on opposite sides - see the graphic above.\nAt the beginning, they rally cross-court (1) trying to keep the ball only inside the deuce service boxes; then (after about a minute) they rally cross-court (2), keeping the ball only inside the ad service boxes; followed by the down-the-line (3) then another down-the-line rally (4).\nHit the ball at a slow pace by shortening the backswing, keeping the feet moving at all times.\nAfter the two players do this drill for about 4–5 minutes, they can move further back and hit the ball deeper and harder.", "img": "t2_02.png"}, {"id": "t2_03", "coll": "2j", "title": "Down-the-Line Finish", "text": "Both players, A and B, rally down-the-line: A hits forehand groundstrokes, B backhand groundstrokes (assuming both are right-handed) – see the graphic below.\nAfter the ball travels 6 times over the net, player A will change direction and hit the ball cross-court, to which player B will chase and go for a put-away shot down-the-line.\nPlayer A will not chase this last shot; the drill ends with B’s down-the-line to the open court winner/finish.\nAfter about 5 minutes, players change roles: B will change the direction of the ball for A to practice down-the-line put-away winners.\nThis drill should also be done with players rallying on the other half of the court: player A with the backhand, B with the forehand.", "img": "t2_03.png"}, {"id": "t2_04", "coll": "2j", "title": "Six by Six", "text": "The following drill is excellent for groundstroke consistency and accuracy.\nThere are two players – A and B. They both begin the drill by rallying on half the court (e.g. A on the ad side vs. B on the deuce side).\nDrill:\nPlayer A (ad side) puts the ball in play and rallies down-the-line using his backhand only; on the other hand, player B will rally down-the-line using his forehand only (assuming both players are right-handed).\nAfter they manage to hit 6 balls over the net, down-the-line, the player who initiated the rally (A) will direct the ball cross-court, and the two players will continue with another 6-ball rally down-the-line on the other half (A’s deuce / B’s ad side).\nThis pattern continues rallying 6 balls alternating on each half until one of them misses.Notes:\n– this drill teaches mental strength (patience, consistency under pressure) and groundstrokes consistency\n– a coach or extra player can count how many balls the two players hit over the net before a mistake is made\n– an extra player can take the place of the player who makes a mistake (if there are 3 or more players on the court)\n– players could rally longer, 8–10 balls down-the-line before switching sides.", "img": "t2_04.png"}, {"id": "t2_05", "coll": "2j", "title": "Team Fifty", "text": "There are two players, at the baseline, opposite sides from each other.\nThe coach (next to one of the net posts) is ready to feed.\nDrill:\nThe coach puts the ball in play for the two players to rally and play as a team, following these rules:\n– every time the ball passes over the net and lands inside the court, the coach counts +1 point\n– for every shot into the net the team loses 5 points (-5)\n– for every shot that lands out, the team loses 3 points (-3).\nThe team’s goal is to get to +50 before their time runs out.\nThey attempt to finish the game in less than 5 minutes, for beginner or intermediate-level players, or less time for more advanced players.", "img": null}, {"id": "t2_06", "coll": "2j", "title": "Away and Back", "text": "There are two players: A at the baseline, and B on the opposite side at the service line.\nThe coach (F) having a basket of balls to feed from is just inside the doubles alley on the same side as player B - see the graphic below.\nDrill:\nOn the cue “Go”, the coach will feed a short ball to player A (1). At this time, player B must turn around and quickly run to touch his baseline (2) and get back to play the drop shot (3) that player A must begin the point with. They play the point out.\nEvery rally begins in this way. First to win 5 points, then players switch sides and roles.\nNote:\nThis can be an exhausting exercise for player B. Therefore, the coach should adjust the feed depth and pace according to players’ level and condition of play", "img": "t2_06.png"}, {"id": "t2_07", "coll": "2j", "title": "Net Crunch", "text": "One of the players (A) is at the baseline, the opposite player (B) begins the drill inside the service box; both players use only half the court (doubles alley included).\nPlayer A is allowed to hit only lobs; player B must tap the net with his racquet after each overhead.\nDrill:\nA starts the point with a lob; B will return it and the two play the point out, keeping the ball only inside the half court.\nConsidering that player B will have to run up to the net to tap it after every shot, this can be an exhausting drill for this particular player.\nPlay first to win 7 points, then switch sides and roles.\nThis drill is recommended to advanced players.", "img": "t2_07.png"}, {"id": "t2_08", "coll": "2j", "title": "Plus/Minus vs Net", "text": "This is a drill played only on half-court.\nOne player is at the net (inside one of the service boxes), and the other player is at the baseline, opposite sides - see the graphic below.\nDrill:\nThe net player (who has a basket of balls nearby) puts the ball in play by feeding it to the baseline player. Once the rally starts (groundstrokes versus volleys), for every ball hit over the net and inside the court, the baseline player gets +1 point; for a miss (net or out) the baseline player loses a point (-1). Her goal is to get to +15 points.\nAll this time, the net player does not win any points; her task is to practice volleys back to the baseline player.\nPlayers can switch roles once +15 is achieved.\nNote:\nThis should be a cooperative drill between the two players, but it can be made competitive by having the net player place the volleys so that the baseline player hustles to get to the balls.", "img": "t2_08.png"}, {"id": "t2_09", "coll": "2j", "title": "Two Minutes", "text": "Two players, let's call them A and B, begin this drill at the baseline, opposite sides. The coach is at one of the net posts having a basket of balls ready to feed from.\nFor two minutes, the coach will feed balls to start the points only to player A, who will rally every ball against her opponent B.\nThe points are counted only for the player to whom the coach feeds (A) who will try to win as many as she can during the 2-minute period.\nAfter the time is up (2 minutes), the players switch sides, having the coach feed, this time, only to player B who will attempt to win a higher number of points than player A previously accumulated.\nThe player with the highest number of points earned during the 2-minute period wins the game.", "img": null}, {"id": "t2_10", "coll": "2j", "title": "The Lob Game", "text": "Player A is at the net, player B at the baseline; the coach (F) is in one of the doubles alleys having a basket of balls to feed from.\nDrill:\nThe coach will feed a lob over player A who’ll turn around, chase and hit it after the bounce. Once she puts the ball in play, the two players will rally the ball until one of them wins. She gets 1 point.\nThe two players get back to their initial positions and play again (each point beginning with a lob over player A).\nAfter one player wins 5 points, they switch sides and roles.\nNotes:\n– the baseline player can choose to stay back or move up to the net while the opponent chases the lob;\n– the coach should advise the net player with regard to movement and set-up in order to get to and around the lob early, in balance and to control the shot.", "img": "t2_10.png"}, {"id": "t2_11", "coll": "2j", "title": "Alternating Topspin and Slice", "text": "One player is at the net, ad side; the other player is at the baseline, ad side.\nPlayers rally on cross-court (net player volleys, baseline player hits backhand groundstrokes) by having the baseline player alternate between slice (under-spin) and topspin.\nIt is not a competitive drill – just rally and practice.\nAfter about 3 minutes, do the same from the deuce side where the baseline player practices slice and topspin forehand groundstrokes.\nPlayers switch roles after 6 minutes: the baseline player comes up to the net while the net player moves back to the baseline.\nThis drill is recommended for advanced players.", "img": "t2_11.png"}, {"id": "t2_12", "coll": "2j", "title": "Move Up on Short Ball", "text": "There are two players: A vs. B, both begin at the baseline, on opposite sides.\nThe coach (F) is outside the singles court, close to the net, and on player B’s side of the court - see the graphic below.\nDrill:\nThe coach will begin every point by feeding the ball so that the first bounce will be on the same side of the net, then the ball should land as a short drop-shot on player A’s side.\nA moves up to get the ball while B steps inside the baseline ready to react.\nThey play the point out then move back to the baseline to start another one.\nPlay first to win 5 points, then players switch sides.\nNote:\nThe purpose of this drill is to teach players anticipation, decision-making, and quick reaction.", "img": "t2_12.png"}, {"id": "t2_13", "coll": "2j", "title": "Depth", "text": "Two players rally cross-court. For every ball that lands between the service line and the baseline, the player who hits it will get +1. For every ball that lands between the service line and net, the player who hits it gets -1.\nPlay for 21 points.\nNote: The rally can be done on both sides, deuce and ad, to work on both forehand and backhand strokes.", "img": "t2_13.png"}, {"id": "t2_14", "coll": "2j", "title": "Half vs Full", "text": "One player, A, is on the half court (deuce side). He will cover from the center line (and the imaginary extension of it) to the singles sideline and from the baseline to the net.\nOn the other side, player B covers the full singles court (singles line to singles line and baseline to net). B can only hit to the half of the court that A covers.\nThe point starts with a courtesy feed from A. They play the point out: A on a half court, B on a full court.\nScoring: Player B will try to win 7 points before player A wins 11 points.\nSwitch roles after every game.", "img": "t2_14.png"}, {"id": "t2_15", "coll": "2j", "title": "Lob It!", "text": "This drill can be played either on a full or a half court.\nPlayer A is at the baseline on one side, player B is about 6 feet from the net on the other side.\nB begins the rally with a “drop and hit”, touches the net and backs up for overhead. A returns the feed with a lob over B.\nThey play the point out.\nPlay first to win 7 points and then switch roles.", "img": "t2_15.png"}, {"id": "t2_16", "coll": "2j", "title": "Three for Air", "text": "Two players (A and B) begin a rally from the baseline.\nThey are both going to look for opportunities to get to the net because if the point is won and the winner’s last shot was a volley or overhead, she/he receives 3 points instead of one. If they win the point in any way other than a volley or an overhead, the winner receives only 1 point.\nPlay first to accumulate 21 points.\nNote:\nThis tennis game promotes aggressive play and getting comfortable transitioning to the net.\nFor doubles players, it can be played on half court – either down-the-line or cross-court.", "img": "t2_16.png"}, {"id": "t2_17", "coll": "2j", "title": "One Hundred", "text": "Two players (A and B) rally from the baseline. It starts with a drop and hit.\nPlayers count the number of times the ball goes over the net during the rally.\nThe player who wins the rally gets a number of points equal to the number of times the ball passes over the net during the rally.\nFor example: if they hit 22 balls over the net, the winner of the rally gets 22 points. If the next rally is won by the other player and, let’s say, 14 balls are passed over the net, the score is now 22-14, and so on… Add the number of points from each rally they win.\nPlay first to win 100 points.\nNote:\n– Good drill for groundstrokes consistency under pressure.\n– An extra player or coach should assist by counting the number of times the ball travels over the net, and keeping score.", "img": "t2_17.png"}, {"id": "t4_02", "coll": "4j", "title": "Zig-Zagging", "text": "This is a drill that allows players to practice groundstrokes accuracy and consistency.\nFour players are positioned at the baseline, two on each side (see graphic below) – players A and B on one side, hit all the balls cross-court; C and D on the opposite side, hit all the balls down-the-line. The coach (F) has a basket of balls to feed from at one of the net posts.\nDrill:\nCoach (F) feeds a ball to player A to start the rally. He sends the ball cross-court to C.\nPlayer C sends the ball down-the-line to B.\nPlayer B sends the ball cross-court to D.\nPlayer D sends the ball down-the-line to A.\nThe pattern continues for as long as the player consistently hits the ball in and to their respective target (cross-court or down-the-line).\nAs soon as a player misses (hits into the net or outside the required target area), the coach quickly puts another ball in, sending it to the player who just missed.\nContinue this drill until they hit 30 balls over the net (coach counts), then players move one spot clockwise, practicing on different targets and strokes.\nVariation:\nIf a player misses, the other team gets a point; play first to win 5 points, then players switch places (right to left and vice versa).\nRecommended to intermediate and advanced players", "img": "t4_02.png"}, {"id": "t4_03", "coll": "4j", "title": "Four for Four", "text": "There are two teams positioned in the one-up-one-back formation: A and C at the baseline, B and D at the net. The coach (F) is on the same side as team A – B, ready to feed balls to team C – D, who starts each point - see the graphic below.\nDrill:\n1. Coach feeds the first ball to player C (at the baseline) short inside the service box to bring him up (and join his partner D at the net). The two teams play the first point out: one team at the net versus the defending team (A-B) in the one-up-one-back formation.\n2. For the second point, team C – D stays up at the net and the coach feeds a volley to player D. The point is also played out.\n3. The third point begins with a ball for the volley to player C (who is now at the net).\n4. The fourth (and last point of the sequence) will be a lob for either player C or D; net player B must get back to the baseline for his team to defend against the overhead.\nAfter the 4th point is played, the players take up the original one-up-one-back position and repeat the pattern. For every point played, the teams keep track of the points they win - first to 11 wins the game/drill and everyone moves one spot clockwise to play again.", "img": "t4_03.png"}, {"id": "t4_04", "coll": "4j", "title": "Tilted", "text": "This begins as a cooperative and controlled drill which ends up in a competitive play.\nThe players are lined up in two one-up-one-back formations: player A at the baseline, his partner B at the net; player C at the baseline opposite from A, his partner D at the net (see graphic below).\nDrill:\nPlayer B has a basket of balls nearby to feed from. He begins the drill by feeding a courtesy ball to C, who will have to send it cross-court to A, who must hit it to D; the latter will tap (volley) the ball to B.\nOnce the 4 shot sequence is completed, the last player (B) will continue hitting the ball towards C and the point is played out from there on.\nSo what begins as a cooperative rally, ends up in a play-to-win situation where players are allowed to move positions once the 4 shot rally is initiated.\nPlay first to win 4 points, then players switch places clockwise.\nIf players like the drill, they can apply as well with the net players on the deuce side and baseline ones holding the ad sides.\nNote:\nRecommended for intermediate and advanced players, this drill promotes strokes control and accuracy.", "img": "t4_04.png"}, {"id": "t4_05", "coll": "4j", "title": "Escalator", "text": "There are two teams: A-B at the net, and C-D begins at the baseline. The coach (F), having a basket of balls nearby, is at the net post, same side as team A-B - see the graphic below.\nDrill:\n- For the first point, the coach will feed a low and short ball to bring team C-D up to the net. They will run up and play the point out – both teams at the net.\n- Next, the coach will call “Net”. The C-D team will have to touch the net with their racquets. As soon as one of the players touches the net, the coach will feed a lob over them. Team C-D will chase the lob and then play it out against team A-B still at the net.\n- The third point continues with the coach yelling “Baseline!” The C-D team will have to touch the baseline with their racquets. As soon as one of the players touches the baseline, the coach will feed a short ball for them to run up again and play the point out from the net position.\nContinue this pattern by moving the team C-D up (to the net) and back (baseline) while keeping the A-B team at the net until one of the sides wins 6 points. Then the teams switch sides and roles.", "img": "t4_05.png"}, {"id": "t4_06", "coll": "4j", "title": "Move Up on Short Ball", "text": "There are two teams of players: A-B vs C-D, at the baseline (opposite sides). The coach is outside the doubles alley, close to the net and on team C-D’s side of court (see the graphic below).\nDrill:\nThe coach will begin every point by feeding the ball so that the first bounce will be on the same side of the net, then the ball should land as a drop-shot on the team A-B side.\nTeam A-B move up together to get the ball while team C-D step inside the baseline ready to react.\nTeams play the point out then move back to the baseline to start another one.\nPlay first to win 5 points, then either rotate players one spot clockwise or have teams switch sides.\nNote:\nThe purpose of this drill is to teach players to work as a team, communicate and learn to anticipate the next shots.", "img": "t4_06.png"}, {"id": "t4_07", "coll": "4j", "title": "Ten to Move On", "text": "This is a drill that puts pressure on players’ groundstrokes accuracy and consistency – recommended to intermediate and advanced players.\nDrill:\nFour players pair up: A rallies with B, C rallies with D. They all begin facing their partners, opposite sides, at the service line.\n1. First, the players must rally 10 balls over the net, keeping the ball only inside the opposite service box.\n2. Once they accomplish that, both players move back to about halfway between the service line and the baseline. Again, they attempt to keep 10 balls over the net rally (balls can land anywhere inside the half-court, alley included).\n3. If this will be done too, the respective team moves with each player on the baseline attempting to go for another 10 balls over the net rally.\n4. The following rally will be done by moving forward to halfway between the service line and baseline (10 balls).\n5. The last rally should be again from the service line – 10 balls.\nThe first team to achieve this progression wins the game.", "img": "t4_07.png"}, {"id": "t4_08", "coll": "4j", "title": "Three for Three", "text": "One team of two players, at the baseline, on each side (team A-B and team C-D). The coach is at the net on one side (F).\nThe team on the same side as the coach is the defending team (team A-B).\nDrill:\nThe coach sends balls to team C-D (attacking team) as follows: 1 short ball to bring them up to the net, 1 volley, and 1 overhead.\nThey play each point out. For every point they win, the teams count it.\nAfter teams play the third ball (overhead), team C-D moves back to the baseline and players switch sides (the player on the ad side moves to the deuce). The cycle repeats with both teams playing the three points (short ball, volley, and overhead).\nThe defending team (team A-B) switches places after every six points (the player on the deuce side moves to the ad side).\nPlay first to 11, then teams switch sides of the court.\nNote: This is a great drill to work on net play and defense, and also improve volleys and overheads in a competitive situation.", "img": "t4_08.png"}, {"id": "t4_09", "coll": "4j", "title": "Big Gap in the Middle", "text": "Two players start at the net as a team against another team of two players on the baseline. The coach is on the side with the net players - see the graphic below.\nAs the coach sends the ball to the baseline team to start the point, the net players shuffle to the closest doubles alley, touch it with the outside foot, and then get back quickly towards the center. The baseline team tries to hit the ball, as quickly as possible, in the “big gap” in the middle created by the net team.\nPlay 7 rallies in this way (the net team shuffles to the doubles alleys after every point) and then switch sides – the baseline team becomes the net team.\nNote: This drill can be exhausting for the net team = good conditioning drill.", "img": "t4_09.png"}, {"id": "t4_10", "coll": "4j", "title": "Dingles", "text": "This game is a mix of playing singles and doubles.\nTwo teams (A-B vs. C-D) are on the baseline, opposite sides.\nThe game begins as a singles rally between the players facing each other (A against C, B against D), half the court (alley included). The rally starts with a \"drop-and-hit\".\nAs soon as one of the half-court rallies is over (the ball is hit out or into the net), they call out “Dingles” and all players continue the point as doubles teams using the whole court and playing the remaining ball.\nScoring:\nFor a win in the singles rally, the respective team gets 1 point; for a win in the doubles rally, the winning team receives 2 points.\nPlay until one of the teams accumulates 11 points and then everybody moves one spot clockwise.", "img": "t4_10.png"}, {"id": "t4_11", "coll": "4j", "title": "Reflex Volleys", "text": "One team of two players on each side of the net, at the service line (teams A-B and C-D). The coach (F) is on the side of team A-B - see the graphic below.\nThe coach sends balls to team C-D and then the point is played out with both teams advancing towards the net.\nOnce the point is over, the teams reset to the service line.\nPlay the first team to 11 points, then each player moves one spot clockwise.\nVariation: The coach sends the ball wide to make the players create angles.", "img": "t4_11.png"}, {"id": "t4_12", "coll": "4j", "title": "Short Court / Around the World", "text": "One team of two players is positioned on the service line on both sides of the court.\nOne of them puts the ball in play with a gentle feed; players play the point out, trying to keep the ball inside the service boxes only. Work on angle, touch shots; no power. Volleys are not allowed for this drill.\nPlayers rotate counter-clockwise after every four balls played, or for a cardio version after every rally.\nNote: good drill for touch and placement practice.", "img": "t4_12.png"}, {"id": "t4_13", "coll": "4j", "title": "Three for Air", "text": "Two teams of two players start every rally from the baseline.\nBoth teams should be looking for opportunities to move up to the net because if they win the point and their last shot was a volley or overhead, they receive 3 points.\nIf they win the point in any way other than a volley or an overhead, they receive only 1 point.\nPlay the first team to win 21 points.\nNote:\nThis game promotes transition to the net; also, for the baseline players, it teaches them to hit the ball low to the approaching net players' feet.\nIf this is part of a tennis class, a coach can start the point with a friendly feed to the team that wins the rally.", "img": null}, {"id": "t4_14", "coll": "4j", "title": "Ultimate Approach", "text": "Two teams of two players (A-B and C-D) start on the baseline on opposite sides of the net. The coach (F) is close to the net, near the doubles alley, same side as team A-B.\nDrill:\nThe coach sends a ball to team C-D, who hits it right after the bounce as they move up to the net. Team A-B goes up to the net also. The point is played out with both teams at the net.\nAfter the first point, the coach will send another ball to team C-D for a volley.\nAfter they play 4 points, both teams will move back to their baseline and the cycle continues.\nPlay for 11 points, then switch players one spot clockwise.\nNote: Good drill for net approach and reflex volleys.", "img": "t4_14.png"}, {"id": "t4_15", "coll": "4j", "title": "Win at the Net", "text": "One team of two players starts at the net (about halfway between the service line and net), and another team of two players is at the baseline on the other side (see graphic below).\nThe coach (who stands close to the net post) will always feed the ball to the team at the baseline.\nThey play the point out.\nIf the team at the net wins, they receive a point and keep playing at the net. When they lose, they move back to the baseline.\nIf the team at the baseline wins, they don’t receive a point, but they move up to the net (where the points count) and play against the opposing team, now at the baseline.\nSo, teams score only when they win by playing at the net.\nThe transition from the net to the baseline should be done in 3 seconds (counted by the coach).\nThe first team to 7 points wins, and then they switch sides.\nNote:\nThis is a players' favorite doubles drill because it gives them a good workout (moving back and forth), improves their net skills, and it is fun.", "img": "t4_15.png"}, {"id": "t4_16", "coll": "4j", "title": "One Hundred", "text": "Two teams of two players begin this game from the baseline, opposite sides.\nThey can all hit anywhere in the court, alleys included.\nOne of them (or the coach) puts the ball in play and the point is played out.\nScoring:\nPlayers (or the coach) count the number of times the ball travels over the net during the rally. The winner of the rally gets a number of points equal to the number of times the ball went over the net during the rally. That is then added to the winning team’s total.\nThe next point, again, they count how many times the ball travels over the net, and the winner adds that number to their score.\nContinue playing until one of the teams earns 100 points. Once that happens, they can either switch sides of the court, or move one spot clockwise and play again.\nThis can be played to 30 or 50 points, and players move one spot clockwise after each game.\nIt is a game to be enjoyed by players of any level, from beginners to advanced.", "img": null}, {"id": "t4_17", "coll": "4j", "title": "Two Up vs Two Back", "text": "One team of two players at the baseline, another team of two players at the net on the opposite side. The coach (F) is on the same side with the net team.\nBoth teams cover and play the full court (alleys included).\nEvery point starts with a feed from the coach to the baseline team.\nDrill:\nThe teams play every point out in this formation: one team starting up at the net, the other team at the baseline. They can move about the court once the point starts.\nPlay the first team to win 7 points, then everyone will move one spot clockwise so that they will each play in a different position and have a new partner after every game.\nNote: good drill for improving net game as well as defensive skills in doubles.", "img": "t4_17.png"}, {"id": "t4_18", "coll": "4j", "title": "Two Minutes", "text": "Two players at the net, and two players at the baseline, opposite sides. The coach is at one of the net posts, the same side as the net players, having a basket of balls nearby.\nEach point starts with a gentle feed from the coach to the baseline team.\nThe baseline team will have 2 minutes to win as many points as they can against the net team. The net team doesn’t count their points, they just try to prevent the baseline team from accumulating too many points.\nAs soon as a point is over, the feeder will put another ball in play.\nAfter 2 minutes are up, the net team will move to the baseline and try to beat the score the other team accumulated (which will now play at the net).\nNote: good drill for volleys under pressure, and groundstroke consistency.", "img": "t4_18.png"}, {"id": "t4_19", "coll": "4j", "title": "Love the Air", "text": "For this drill, there are four players divided into two teams. They can use any formation to play the game (e.g. one-up-one-back, both-up, etc.).\nPlayers take turns serving one game at a time. A game is considered when a team wins 10 points. The points are counted as follows:\n– 1 point if the team’s last shot was a groundstroke\n– 3 points for a volley\n– 5 points if the last shot was an overhead.\nPlay the first team to win 5 games.\nThis drill/game encourages players to be aggressive and play up at the net whenever possible.", "img": null}, {"id": "dbl_02", "coll": "dbl", "title": "Waiting for You", "text": "Situation :\n4 joueurs :\n\nA au fond → reçoit le service\n\nB au filet (partenaire de A)\n\nC sert\n\nD au filet (partenaire du serveur)\n\nDéroulement :\nC sert vers A.\n\nDès qu’A renvoie le retour, elle DOIT monter au filet.\n\nLe point ne commence vraiment (et ne compte) que lorsqu’A entre dans la zone de service.\n\nSi A ne rentre pas assez vite (= ne franchit pas la ligne de service), le point est annulé et on recommence.\n\nLes points se jouent normalement, en format set classique.\n\nObjectifs :\nHabituer le retourneur à monter immédiatement.\n\nEntraîner le timing du split-step en avançant.\n\nAméliorer la qualité du retour + montée.\n\nApprendre au partenaire du serveur à ne pas poacher trop tôt pour laisser le retourneur accéder au filet.", "img": "dbl_02.png"}, {"id": "dbl_03", "coll": "dbl", "title": "T-Serve / Return Placement", "text": "This drill is designed for two doubles players (A and B); the coach (F) can take up the net position (e.g. server’s partner).\nThe purpose of this drill is for one of the players to practice serve placement (A) while the other to practice strategic serve return (B) – all these are necessary skills for competitive doubles players.\nDrill:\nPlayer A is the server; he will aim all his serves close to the center line (down-the-T).\nPlayer B will practice returning the serve to the two possible doubles options meant to avoid the opposing net player.\nReturn Options that the returner (B) should send the ball to:\n1. Cross-Court\n2. Lob Over the Net Player\nThe coach (at the net) gives instructions and acts as an “opponent” that the returner must avoid (hit away from).\nNo point is played out – just serve and return of serve practice.\nAfter about 5-7 minutes, players switch sides and roles.\nPractice this drill on both sides: deuce and ad.", "img": "dbl_03.png"}, {"id": "dbl_04", "coll": "dbl", "title": "Middle Serve / Return Placement", "text": "This drill is designed for two doubles players (A and B); the coach (F) can take up the net position (e.g. server’s partner).\nThe purpose of this drill is for one of the players to practice serve placement (A) while the other to practice strategic serve return (B) – all these are necessary skills for competitive doubles players.\nDrill:\nPlayer A is the server; he will aim all his serves in the middle of the service box (“to the body”).\nPlayer B will practice returning the serve toward the two possible doubles options meant to avoid the opposing net player.\nReturn Options that the returner (B) should send the ball to:\n1. Cross-Court\n2. Lob Over the Net Player\nThe coach (at the net) gives instructions and acts as an “opponent” that the returner must avoid (hit away from).\nNo point is played out – just serve and return of serve practice.\nAfter about 5-7 minutes, players switch sides and roles.\nPractice this drill on both sides: deuce and ad.", "img": "dbl_04.png"}, {"id": "dbl_05", "coll": "dbl", "title": "Wide Serve / Return Placement", "text": "This drill is designed for two doubles players (A and B); the coach (F) can take up the net position (e.g. server’s partner).\nThe purpose of this drill is for one of the players to practice serve placement (A) while the other to practice strategic serve return (B) – all these are necessary skills for competitive doubles players.\nDrill:\nPlayer A is the server; he will aim all his serves close to the singles sideline (wide).\nPlayer B will practice returning the serve toward the three possible doubles options meant to avoid the opposing net player.\nReturn Options that the returner (B) should send the ball to:\n1. Wide Angle Cross-Court\n2. Down-the-Alley\n3. Lob Over the Net Player\nThe coach (at the net) gives instructions and acts as an “opponent” that the returner must avoid (hit away from).\nNo point is played out – just serve and return of serve practice.\nAfter about 5-7 minutes, players switch sides and roles.\nPractice this drill on both sides: deuce and ad.", "img": "dbl_05.png"}, {"id": "dbl_06", "coll": "dbl", "title": "Covering Court at Net", "text": "This drill is designed for beginning or intermediate-level players who want to improve their doubles game, especially the court coverage and getting to the ball quicker at the net.\nSetup:\nThe coach (F) is at the baseline, deuce side. Player A is the coach’s partner at the net (ad side). Players B and C are on opposite sides, one ready to return serve, the other at the service line.\nPurpose:\n– to teach the server’s partner (A) how to move and cover the court according to where his partner (the coach) places the serve.\n– considering that at the beginning and intermediate levels the server’s accuracy is not that well established, the net partner must learn how to cover the court accordingly.\nDrill:\nThe coach (F) will serve to player B; depending on where the serve lands, the coach’s partner must move towards the net and in the direction of where the ball lands: if it is closer to the alley, player A moves to cover the alley; if it is closer to the center court, A covers the eventual down the center return.\nThe ball is played out.\nAfter each point, players rotate so that other players waiting (recommended to have no more than 4 players working on a doubles tactics lesson) will take their turn returning or practicing movement at the net.\nAfter about 3 full rotations, the coach will step out and let the players play the point while the coach will observe and give instructions, especially to the server’s partner regarding positioning at the net.", "img": "dbl_06.png"}, {"id": "dbl_07", "coll": "dbl", "title": "Wide Serve / Return Placement", "text": "This drill is designed for two doubles players (A and B); the coach (F) can take up the net position (e.g. server’s partner).\nThe purpose of this drill is for one of the players to practice serve placement (A) while the other to practice strategic serve return (B) – all these are necessary skills for competitive doubles players.\nDrill:\nPlayer A is the server; he will aim all his serves close to the singles side line (wide).\nPlayer B will practice returning the serve towards the three possible doubles options meant to avoid the opposing net player:\n1. Wide Angle Cross-Court\n2. Down-the-Alley\n3. Lob Over the Net Player\nThe coach (at the net) gives instructions and acts as an “opponent” that returner must avoid (hit away from).\nNo point is played out – just serve and return of serve practice.\nAfter about 5 minutes, players switch sides and roles.\nPractice this drill on both sides: deuce and ad.", "img": "dbl_07.png"}, {"id": "dbl_08", "coll": "dbl", "title": "Covering the Court at the Net", "text": "This drill is designed for beginning or intermediate level players who want to improve their doubles game, especially the court coverage and getting to the ball quicker at the net.\nSetup:\nThe coach (F) is at the baseline, deuce side. Player A is the coach’s partner at the net (ad side). Players B and C are opposite sides, one ready to return serve, the other at the service line.\nPurpose:\n– Teach the server’s partner (A) to move and cover the court according to where his partner (the coach) places the serve.\n– Considering that at the beginning and intermediate levels the server’s accuracy is not that well established, the net partner must learn how to cover the court accordingly.\nDrill:\nThe coach (F) will serve to player B; depending on where the serve lands, the coach’s partner (A) must move towards the net and in the direction of where the ball lands:\n- if it is closer to the alley, player A moves to cover the alley;\n- if it is closer to the center line, A covers the eventual down the center return.\nThe ball is played out.\nAfter each point, players rotate so that other players waiting (recommended having no more than 4 players working on a doubles tactics lesson) will take their turn returning or practicing movement at the net.\nAfter about 3 full rotations, the coach will step out and let the players play the point while the coach will observe and give instructions especially to the server’s partner in regard to positioning at the net.", "img": "dbl_08.png"}, {"id": "dbl_09", "coll": "dbl", "title": "Smart Lob Return", "text": "There are two players: A practices serving from the deuce side, B returning every serve with a lob down the line.\nThe reason player B returns down the line is because, in a real doubles match situation, his opposing net player would be inside the ad service box.\nTo make the drill more challenging, a line of cones should be placed about 6 – 8 feet inside and parallel to the baseline; player B should aim his lobs to land between the baseline and cones.\nAfter the returner gets 7 lobs deep, they can switch to the ad side.\nPlayers should change roles as well: the server will take his turn to practice the lobs too.\nNote:\nThe lob is one of the most “hated” shots in doubles. Therefore, it must be practiced and used especially as a serve return option.", "img": "dbl_09.png"}, {"id": "dbl_10", "coll": "dbl", "title": "Smart Net Play", "text": "The coach (F) is just inside the baseline, deuce side. Players line up behind the service line, deuce side, opposite to the coach (see the graphic below).\nThe first player in line will step up towards the net and prepare to execute 10 volleys (fed by the coach).\nFor the tactical purpose, the player will have to decide which balls he’ll return/volley cross-court and which ones he should hit aggressively down-the-line inside the opposing ad service box (place some targets there).\nNote:\nPlayers should be instructed to hit the low and medium high balls cross-court while the high ones should be attacked and hit down-the-line (at the feet of the imaginary opposing net player).\nPractice this drill on both sides, deuce and ad.", "img": "dbl_10.png"}, {"id": "dbl_11", "coll": "dbl", "title": "Playing Against Lob Return", "text": "This situation happens in a doubles match when one of the players has a weak backhand and prefers to lob the return of serve over the net opponent.\nIn this case, the serving team (A-B) should begin with the net player situated further back, just inside the service line, so that he can intercept the incoming lob – see graphic below.\nAnother alternative would be for the net player to begin closer to the net and, as his partner serves, he moves back towards the service line in anticipation of the lob return.\nPlay 4 games (each player serves one game) where the return is always a lob, and the opposing net player begins the point just inside the service line.\nThis teaches players that the position at the net must not always be the same at the beginning of the point; it should be adjusted based on the opponents’ weaknesses and the serve placement.", "img": "dbl_11.png"}, {"id": "dbl_12", "coll": "dbl", "title": "I-Formation Tactics", "text": "There are two teams: A – B and C – D.\nTeam C – D will play every point in the one-up-one-back formation while team A – B will begin in the “I” formation (net player is at the center line; server close to baseline center mark) every time.\nThe coach (F), who previously instructed the players about the benefits of the “I” formation, will supervise and advise A and B players at each point.\nDrill:\nPlay regular games while having the serving team (A – B) begin in the “I” formation.\nAfter a game is completed, the other team serves, also beginning each point in the “I” formation.\nThis pattern repeats until every player gets to serve and play at the net using this strategic form.\nAdvantages of the “I” formation:\nThe element of surprise: the returner does not know where the opposing net player will move.\nDisadvantages of the “I” formation:\nIf not timed properly, the switch between the serving and net players could affect their court coverage and getting to the ball on time.\nEvery intermediate and advanced level player should be familiar with the “I” formation – how to play it and how to play against it.", "img": "dbl_12.png"}, {"id": "dbl_13", "coll": "dbl", "title": "Run for It", "text": "There are two teams (A – B and C – D) positioned in the one-up-one-back formation - see the graphic below. Players A and C at the baseline, B and D at the net. The coach (F), having a basket of balls nearby, is on the same side as team A – B.\nDrill:\nEvery point begins when the coach feeds a lob towards player D who is at the net. As soon as the coach feeds the lob, player B who is also at the net will have to move back in order to protect himself from having the overhead directed at him.\nPlayer D can play the overhead in any direction: towards retrieving player B or player A.\nFrom that point on, the two teams play the point out.\nFor the next point, everyone gets back to their initial position and plays again.\nOnce a team wins three points, everyone moves one spot clockwise.\nNotes:\nThe purpose of this tactical drill is for the defending team (A-B in this case) to learn how to move and block the incoming overhead. Oftentimes, doubles teams are taken by surprise by the net player intercepting a lob or baseline player failing to send the ball over the net player.\nAlso, the player at the net who is about to hit the overhead, must quickly plan where is the best option to send the ball to (ideally it should be aimed in the direction of the closest player).", "img": "dbl_13.png"}, {"id": "dbl_14", "coll": "dbl", "title": "Join Me", "text": "There is a team of two players (A and B) at the service line on one side; on the other side, player C is just inside the service line, his partner D begins the drill from the baseline - see the graphic below.\nDrill:\nThe ball is put in play by the A-B team who will drop and hit a short ball (1) for player D to move up (2) and join his partner C at the net.\nOnce the ball is returned by D (3), the two teams play the point out having all players inside their respective service courts.\nAfter each rally, player D moves back to the initial position at the baseline and the point repeats with another short ball from team A-B (a basket of balls should be positioned close to A-B team for their convenience).\nAfter either team wins 5 points, players rotate one spot clockwise and the drill repeats until everyone gets to play from each spot.\nNote:\n– This is a good drill to teach and practice playing at the net, working together and quick decision-making.\n– The approaching player learns to take quick decisions in regard to placement; the approaching net team learns to cover the court and call the shots.", "img": "dbl_14.png"}, {"id": "dbl_15", "coll": "dbl", "title": "Counteract the Low Short", "text": "The coach (F) is just behind the service line, deuce side, having a basket of balls to feed from.\nThe players are positioned as follows: A at the deuce side baseline, B at the net (ad side) – both are opposite to the coach; player C is on the same side with the coach, at the service line - see the graphic below.\nDrill:\nOn the “go!” the coach will feed a very low and short ball into the opposing service court for player A to move up. A will have to run up and get it before it bounces twice and push it over the net as a drop-shot. The coach and his partner (C) will move up and from there on the point is played out.\nFor this drill, no lobs are allowed – players will practice good court positioning and shot placement.\nOnce the point is over, players take their initial positions and the drill repeats.\nRotate players places clockwise after each 5 points (the coach stays put).\nNote:\nThrough this drill, the players practice dynamic balance, court positioning and quick decision-making.", "img": "dbl_15.png"}, {"id": "dbl_16", "coll": "dbl", "title": "The Right Spot", "text": "There are three players on the court, the rest are waiting for their turn behind the baseline - see the graphic below.\nPlayer A is the server, B is at the net, and player C is the returner. The coach (F) is at one of the net posts giving instructions to the players.\nThis drill is about teaching the player at the net how to position themselves according to where their partner’s serve is being placed.\nThe player at the net needs to position themselves properly after the serve is delivered so that they will be in the closest spot possible for an eventual volley.\nSet-up:\nThere are 3 marks placed inside the service box, on the returner's side:\n1. Red: close to the singles sideline and service line.\n2. Yellow: close to the service line and about halfway between the center line and singles sideline.\n3. Blue: close to the center line and service line.\nThere are also 3 marks inside the service box where the server’s partner (B) stands: red (wide), yellow (middle), and blue (inside – closer to the center line).\nThe net player begins the drill just behind the line of marks (precisely behind the yellow one).\nDrill:\nPlayer A hits 3 serves – anywhere inside the service box.\nPlayer B will have to move and do a split step just above the spot that corresponds with the side (mark) that the serve was delivered to.\nExample: If the serve lands close to the blue mark, the net player will step forward followed by a split step on the respective blue mark in front of them (see graphic below).\nThe same if the serve is delivered to any other mark inside the opposite service box, the net player will split-step where the respective colored marker is.\nPlayer C, on the other hand, will return every ball to the net player (B) to take a practice volley.\nAfter every 3 serves, players rotate clockwise so that everyone gets to practice court movement and positioning at the net.\nNote:\nThis drill, as you can tell, teaches the net player to move according to where their partner’s serve is being delivered. This action puts him in the best position to cover the court and be quicker for an eventual volley.", "img": "dbl_16.png"}, {"id": "dbl_17", "coll": "dbl", "title": "Lob Over the Net Player", "text": "Tactical Purpose:\nThis drill teaches the team that is getting lobed how to position and communicate, as well as teaches the opposing team to attack and put pressure on their opponents.\nSet-up:\nBoth teams (A-B and C-D) are positioned in one-up-one-back formations, on opposite sides. The coach (F) is at the net, close to player B - see the graphic below.\nDrill:\nThe coach will feed a lob over player B. While player A runs to retrieve the lob, player B will switch over to the other half and move back toward the baseline (facing the net) as quickly as she can. As team A-B retrieves the lob, team C-D will move up to the net and prepare for an eventual overhead.\nThe two teams play the point out.\nStart each point in the same set-up and same feed until one of the teams wins 5 points.\nThey will then rotate one spot clockwise so that every player will practice lob retrieving, switching, and attacking.", "img": "dbl_17.png"}, {"id": "dbl_18", "coll": "dbl", "title": "Quick Switch", "text": "One of the tactics that a serving team in doubles can use is to switch halves of the court once the ball is put into play. To do so, both players (at the net and baseline) must time their moves properly.\nThe following drill will teach the serving team to accomplish just that.\nDrill:\nTeam A-B are the serving team, C-D are the receiving team.\nA serves to D, B and C are at the net, opposite sides.\nThe two teams alternate serving 2 points each, and they all play a game to 11.\nOnce A serves to D, both players, A and B, must wait until the ball bounces inside the service box before they do the switch – B moves left, A moves right (as in the graphic below). Their switch has to be very quick and in balance and… only right as the ball bounced.\nAlternate serving two points, having the serving team’s players switch left-right as the serve gets in.\nNote:\nEven though the serving team’s movement is predictable, they can still work on timing their switch and quickness.", "img": "dbl_18.png"}, {"id": "dbl_19", "coll": "dbl", "title": "Rolling Ball", "text": "Two doubles teams play a set where the serving team will always begin the point with both players at the baseline, followed by transitioning to the net once the serve is in. The receiving team should begin every point in a one-up-one-back formation.\nTeam A-B is the serving team; they both begin on the baseline. Team C-D is the receiving team and are in a one-up-one-back formation - see the graphic below.\nAs soon as A’s serve is in, A and B move up to the net. Play the point out.\nKeep the score and once a game is over, team C-D will be the serving team beginning every point from the baseline while team A-B will switch to the one-up-one-back formation.\nNote:\nThe game teaches the serving team to play aggressively, work together and improve the transition from baseline to the net (split steps, low volleys, smart decision-making as far as placement of low volleys, etc.)", "img": "dbl_19.png"}, {"id": "dbl_20", "coll": "dbl", "title": "Against the Two - 1", "text": "This drill/game teaches the one-up-back-formation team how to play against a two-up formation: court positioning, shot selection, and communication.\nSet-up:\nThere is a one-up-one-back team on one side: player A at the baseline and (her partner) player B is just inside the service line. The other team begins with players C and D on the service line.\nDrill:\nEvery point begins with player A feeding a ball to team C-D, who approaches the net as soon as they receive the feed.\nFrom there on, the point is played out respecting the following details (given to players by the coach):\n– player B is in a fragile position being attacked by the two opposing players;\n– player A should not stand too far back – it is recommended that she steps inside the baseline to cover the angles and short balls;\n– team A – B is in a tough situation, offering so much court open for the opposing team (between them and on the baseline player’s side);\n– a suggestion for the baseline player would be to join her partner at the net.\nPlay first to 7 points, then players switch places clockwise.", "img": "dbl_20.png"}, {"id": "dbl_21", "coll": "dbl", "title": "Against the Two - 2", "text": "For this drill, the one-up-one-back formation learns how to deal with both-up opponents – lobbing them and the possible situations that can arise from this tactic.\nSet-up:\nThe one-up-one-back team is positioned with A at the baseline and B at the net. On the other side, there are C and D both at the net. The coach (F) is outside the doubles alley on the same side as the net team; he feeds balls from the basket to begin the point.\nDrill:\nThe coach will begin the point by feeding a ball to player A; she will have to lob the first ball attempting to hit it over the net team. For this drill, the net team cannot move back until player A makes contact with the ball (variation: as the coach feeds the ball to A, the net team should move up and touch the net).\nOnce the lob is made, the teams play the point out.\nTactical points to follow:\n– if the lob is successful, player A should move up to the net too.\n– if the lob is short, player A should call out to her partner to move back.\n– player B, at the net, should try to keep her eyes on the team at the net only and avoid looking back at her partner; by doing this she can read (based on their body language) whether her partner’s lob is a deep one or her opponents prepare to attack her.\nPlay first to win 7 points, then rotate one spot clockwise so that every player experiences each positional situation.", "img": "dbl_21.png"}, {"id": "dbl_22", "coll": "dbl", "title": "Defending Against the Overhead", "text": "Set-up:\nTeam A-B is in a one-up-one-back formation (A at the baseline, B at the net). Team C-D is at the net. The coach (F) is at the corner of the baseline and doubles side line same side as player B.\nTactical Purpose:\nIn case of a short lob toward the net team, the back player should call to her partner to move back quickly; the net player moves closer to the baseline in a defensive position.\nDrill:\nThe coach will feed a high lob that is meant to land inside the service court on the team C-D’s side. Team C-D intend to let the ball bounce before they hit it so that player B has time to move back (only for the purpose of this drill to avoid injuries).\nAs the coach feeds the high lob, he’ll call “Back!” to let player B know that she should move back quickly.\nPlay the point out starting this way until one team wins 4 points, then everybody moves one spot clockwise.\nNote:\nPlayer B should turn sideways and either shuffle sideways or cross-cover steps to move quickly away from the net.", "img": "dbl_22.png"}, {"id": "dbl_23", "coll": "dbl", "title": "Defending Against the Net Player", "text": "There are two doubles teams – A-B and C-D.\nThe first point of the game will begin with player A receiving serve (on the deuce side), player B (A’s partner) at the service line, player C serving from the deuce side, and player D (C’s partner) at the service line - see the graphic below.\nThe purpose of this drill is to get team A-B in a situation where they have to defend against a net player. For this we’ll have the following drill:\nAs soon as player C serves, player D will move up from the service line toward the net; the return of serve (executed by player A) must be hit toward player D. From there on, the point is played out with players being allowed to hit anywhere into the court.\n*The reason we recommend player D to begin the point from the service line is so that she does not get too close to the net when the return of serve comes to her – that would make it too easy to put the ball away.\nNote to player D:\nShe must practice proper footwork (split step) as she moves up to the net following the sound of her partner’s serve.\nThis drill will teach the receiving team how to handle the point when the returner is forced (or chooses) to hit the first ball to the opposite team’s net player.\nPlay games to 7 points. After each game, the players rotate clockwise one spot so that each one gets to experiment with every situation (net, serving, returning, etc.", "img": "dbl_23.png"}, {"id": "dbl_24", "coll": "dbl", "title": "Defending Against the Returner", "text": "There are 3 players on the court: A is ready to return serve, B is A’s partner at the service line, C is at the net opposite A - see the graphic below. The coach (F) is just inside the baseline having a basket of balls ready to serve from (easy pace serves).\nIf there are more than 3 players in this class, the remaining ones (D and E) will wait outside the lines and players will rotate after every 4 points played.\nDrill:\nThe coach serves to player A.\nA will have to return every serve towards C.\nC practices the following:\n– if A’s return is hard, C will block the ball and send it back to A;\n– if A’s return is slower, C will attack it and send the ball towards B’s feet or angle it away from her.\nB’s job is to defend and react from the service line.\nAfter player C hits the ball to B the play stops right after B’s reaction to the ball.\nNote:\nThe purpose of this drill is to teach the net player the options she has when the return of serve comes to her. Once these options are practiced, they will be easily applied during the match.", "img": "dbl_24.png"}, {"id": "dbl_25", "coll": "dbl", "title": "Moving Up and Down", "text": "The players are lined up as follows: A and C are at the baseline deuce and opposite sides; B and D are the net players (opposite sides), ad side – see the graphic below.\nThe coach (F) is on the same side and close to player C, having a basket of balls ready to feed from.\nTactical Purpose:\nTeach players to move up to the net and then work together when a lob is happening.\nDrill:\nOn the “Go!”, the coach will feed a ball to player A (cross-court); at the same time, player C will move up to the net (trying to get inside the service line quickly).\nPlayer A’s first return should be cross-court toward the approaching player (C).\nC will execute a half or low volley back to A. Player A’s second shot will be a lob over the opposing net players (C and D).\nFrom there on, the point is played out.\nAfter every 3 points, the players rotate one spot clockwise.\nNotes:\nFor the first two shots, players B and D do not intervene.\nThe coach should point out players’ positioning, communication, and shot selection.", "img": "dbl_25.png"}, {"id": "perso_elija", "coll": "perso", "title": "Séance pour Elija", "text": "Echauffement 2min\nFond de court 3min\nOn met un cible dans le fond  de court au coté de CD et je lance la medecine ball et puis il cours il lance la medecine balle comme un CD 30sec\nPuis le meme exercice avec un une raquette et a vide 30sec\nPuis il  frappe des CD 30 sec\nIl repete ce exrcice 3 fois\nLa meme chose pour le RV\nDeux plots un peut ecarter au milieu du terrain apres 4 repetition aller et retour quand il prend la balle du coter du CD il court vers le plots de l’extremité du terrain du RV et il lance la medecine ball et puis il repete et il lance la medecine ball au coté du CD  (ON PEUT AJOUTER XBANDS)\nV lauf avec la medecinne ball et le Xbands 30sec\nService en 3 progression\nIl lance la medecine balle avec deux mains vars moi je ssuis dans la ligne du carre de service et il mais une pas vers lavant apres la lancement il dois depasser le cible qui est avant un petit peu du fond de court\nPuis il met un service avec la raquette et a vide mais il est attacher par moi avec l’elastique\nService normal", "img": null}];

  _bg.blobs=[]; for(let i=0;i<5;i++){_bg.blobs.push({x:Math.random(),y:Math.random(),r:0.3+Math.random()*0.35,
    dx:(Math.random()-.5)*0.00008,dy:(Math.random()-.5)*0.00008,c:cols[i%cols.length],ph:Math.random()*6.28});}
  _bg.balls=[]; for(let i=0;i<7;i++){_bg.balls.push({x:Math.random(),y:Math.random(),r:3+Math.random()*4,
    dx:(Math.random()-.5)*0.0004,dy:(Math.random()-.5)*0.0004});}
  const ctx=cv.getContext("2d");
  const reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  function frame(t){
    const W=_bg.w,H=_bg.h,dk=isDark();
    ctx.clearRect(0,0,W,H);
    ctx.globalCompositeOperation="lighter";
    for(const b of _bg.blobs){
      if(!reduce){b.x+=b.dx;b.y+=b.dy;}
      const cx=(0.5+Math.sin((t*0.00006)+b.ph)*0.45* (reduce?0:1) + (b.x-0.5))*W;
      const cy=(0.5+Math.cos((t*0.00005)+b.ph)*0.45*(reduce?0:1) + (b.y-0.5))*H;
      const rad=b.r*Math.min(W,H);
      const g=ctx.createRadialGradient(cx,cy,0,cx,cy,rad);
      const a=dk?0.22:0.13;
      g.addColorStop(0,hexA(b.c,a)); g.addColorStop(1,hexA(b.c,0));
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,rad,0,6.2832); ctx.fill();
    }
    ctx.globalCompositeOperation="source-over";
    for(const b of _bg.balls){
      if(!reduce){b.x+=b.dx;b.y+=b.dy; if(b.x<0||b.x>1)b.dx*=-1; if(b.y<0||b.y>1)b.dy*=-1;}
      const cx=b.x*W,cy=b.y*H,r=b.r*(W/innerWidth);
      ctx.fillStyle=hexA("#e9e24a",dk?0.16:0.12); ctx.beginPath(); ctx.arc(cx,cy,r,0,6.2832); ctx.fill();
    }
    if(!reduce)_bg.raf=requestAnimationFrame(frame);
  }
  if(_bg.raf)cancelAnimationFrame(_bg.raf);
  if(reduce)frame(0); else _bg.raf=requestAnimationFrame(frame);
}
function hexA(hex,a){const h=hex.replace("#","");const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);return `rgba(${r},${g},${b},${a})`;}

/* ============================= COURT RENDER ============================= */
const COL={cd:"#e07d33",rev:"#9b57cf",feed:"#d7ad2e",mv:"#3f84cf",marc:"#d9534b"};
function head(x1,y1,x2,y2,c){
  const a=Math.atan2(y2-y1,x2-x1),hl=10,sp=0.42;
  const p1=[x2-hl*Math.cos(a-sp),y2-hl*Math.sin(a-sp)];
  const p2=[x2-hl*Math.cos(a+sp),y2-hl*Math.sin(a+sp)];
  return `<polygon points="${x2.toFixed(1)},${y2.toFixed(1)} ${p1[0].toFixed(1)},${p1[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}" fill="${c}"/>`;
}
function tspans(x,y,txt,fill,size){
  const lines=String(txt).split("\n");
  const lh=size*1.12, y0=y-((lines.length-1)*lh)/2;
  return lines.map((ln,i)=>`<tspan x="${x}" y="${(y0+i*lh).toFixed(1)}">${esc(ln)}</tspan>`).join("");
}
function courtSVG(dia){
  const W=300,H=470, x0=55,x1=245, y0=35,y1=435, net=235, svT=135, svB=335;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="diagramme">`;
  // apron + court
  s+=`<rect x="0" y="0" width="${W}" height="${H}" rx="12" fill="#2c7d4e"/>`;
  s+=`<rect x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}" fill="#3f9163"/>`;
  const line="#f3faf4", lw=1.6;
  // outer + sidelines + baselines
  s+=`<g stroke="${line}" stroke-width="${lw}" fill="none">`;
  s+=`<rect x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}"/>`;
  s+=`<line x1="${x0}" y1="${svT}" x2="${x1}" y2="${svT}"/><line x1="${x0}" y1="${svB}" x2="${x1}" y2="${svB}"/>`;
  s+=`<line x1="150" y1="${svT}" x2="150" y2="${svB}"/>`;
  s+=`<line x1="146" y1="${y0}" x2="154" y2="${y0}"/><line x1="146" y1="${y1}" x2="154" y2="${y1}"/>`;
  s+=`</g>`;
  // net
  s+=`<line x1="48" y1="${net}" x2="252" y2="${net}" stroke="#13351f" stroke-width="3.2" stroke-dasharray="5 4"/>`;
  s+=`<text x="${x1-2}" y="${net-5}" fill="#eaf6ee" font-size="9" text-anchor="end" font-family="Inter,sans-serif" opacity=".85">filet</text>`;

  for(const e of (dia||[])){
    if(e.t==="A"){
      const [a,b,c,d]=e.a, col=COL[e.c]||"#fff";
      s+=`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${col}" stroke-width="3" fill="none" stroke-linecap="round"${e.dash?' stroke-dasharray="6 5"':''}/>`;
      s+=head(a,b,c,d,col);
      if(e.dbl) s+=head(c,d,a,b,col);
    } else if(e.t==="C"){
      s+=`<polygon points="${e.x},${e.y-9} ${e.x-8},${e.y+7} ${e.x+8},${e.y+7}" fill="#ef7f2a" stroke="#fff" stroke-width="1.3"/>`;
    } else if(e.t==="HP"){
      s+=`<circle cx="${e.x}" cy="${e.y}" r="${e.r}" fill="none" stroke="#f0b53a" stroke-width="4"/>`;
    } else if(e.t==="LAD"){
      const {x,y,w,h,n}=e; s+=`<g stroke="#f3faf4" stroke-width="2.4" fill="none">`;
      s+=`<line x1="${x}" y1="${y}" x2="${x}" y2="${y+h}"/><line x1="${x+w}" y1="${y}" x2="${x+w}" y2="${y+h}"/>`;
      for(let i=0;i<=n;i++){const yy=y+h*i/n; s+=`<line x1="${x}" y1="${yy}" x2="${x+w}" y2="${yy}"/>`;}
      s+=`</g>`;
    } else if(e.t==="HRD"){
      const {x,y,n,gap}=e, tot=(n-1)*gap, sx=x-tot/2;
      for(let i=0;i<n;i++){const xx=sx+i*gap; s+=`<path d="M${xx-11},${y} q11,-15 22,0" fill="none" stroke="#dfe9df" stroke-width="3"/>`;}
    } else if(e.t==="FT"){
      s+=`<ellipse cx="${e.x}" cy="${e.y}" rx="7" ry="10" fill="#1565C0" stroke="#fff" stroke-width="1.2"/>`;
      s+=`<text x="${e.x}" y="${e.y+3.5}" fill="#fff" font-size="9" font-weight="700" text-anchor="middle" font-family="Space Grotesk,sans-serif">${e.n}</text>`;
    } else if(e.t==="BALL"){
      s+=`<circle cx="${e.x}" cy="${e.y}" r="6" fill="#e9e24a" stroke="#7a7410" stroke-width="1.3"/>`;
    } else if(e.t==="Z"){
      s+=`<rect x="${e.x}" y="${e.y}" width="${e.w}" height="${e.h}" rx="7" fill="#ffd54a" opacity=".22" stroke="#ffd54a" stroke-width="1.3"/>`;
      s+=`<text x="${e.x+e.w/2}" y="${e.y+e.h/2+3.5}" fill="#fff" font-size="9.5" font-weight="700" text-anchor="middle" font-family="Space Grotesk,sans-serif">${esc(t({fr:e.fr,de:e.de}))}</text>`;
    } else if(e.t==="P"){
      const col=e.who==="tara"?"#1565C0":"#d9534b";
      s+=`<circle cx="${e.x}" cy="${e.y}" r="11" fill="${col}" stroke="#fff" stroke-width="2.4"/>`;
      const nm=e.who==="tara"?(S.player||"Tara"):"Marc";
      const ty=e.who==="tara"?e.y-16:e.y+20;
      s+=`<text x="${e.x}" y="${ty}" fill="#fff" font-size="10.5" font-weight="700" text-anchor="middle" font-family="Space Grotesk,sans-serif">${esc(nm)}</text>`;
    } else if(e.t==="L"){
      const col=e.c?(COL[e.c]||"#fff"):"#fff";
      s+=`<text fill="${col}" font-size="10" font-weight="700" text-anchor="middle" font-family="Space Grotesk,sans-serif" paint-order="stroke" stroke="#163a24" stroke-width="2.6" stroke-linejoin="round">${tspans(e.x,e.y,t({fr:e.fr,de:e.de}),col,10)}</text>`;
    }
  }
  s+=`</svg>`; return s;
}

/* ============================= UTIL ============================= */
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function fmtTime(sec){const m=Math.floor(sec/60),s=sec%60;return m+":"+String(s).padStart(2,"0");}
function initials(n){return n.trim().slice(0,2).toUpperCase();}
const $=s=>document.querySelector(s);

/* ============================= VIDEOS (IndexedDB) ============================= */
let _vdb=null, _vready=false;
function vdbOpen(){
  return new Promise((res,rej)=>{
    if(_vdb) return res(_vdb);
    let rq; try{ rq=indexedDB.open("coachVideos",1); }catch(e){ return rej(e); }
    rq.onupgradeneeded=()=>{ const db=rq.result; if(!db.objectStoreNames.contains("v")) db.createObjectStore("v",{keyPath:"id"}); };
    rq.onsuccess=()=>{ _vdb=rq.result; res(_vdb); };
    rq.onerror=()=>rej(rq.error);
  });
}
function vPut(rec){ return vdbOpen().then(db=>new Promise((res,rej)=>{const tx=db.transaction("v","readwrite");tx.objectStore("v").put(rec);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);})); }
function vAll(){ return vdbOpen().then(db=>new Promise((res,rej)=>{const tx=db.transaction("v","readonly");const rq=tx.objectStore("v").getAll();rq.onsuccess=()=>res(rq.result||[]);rq.onerror=()=>rej(rq.error);})); }
function vGet(id){ return vdbOpen().then(db=>new Promise((res,rej)=>{const rq=db.transaction("v","readonly").objectStore("v").get(id);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);})); }
function vDel(id){ return vdbOpen().then(db=>new Promise((res,rej)=>{const tx=db.transaction("v","readwrite");tx.objectStore("v").delete(id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);})); }

function importVideo(e){
  const file=e.target.files&&e.target.files[0]; if(!file) return;
  const id="v"+Date.now();
  genThumb(file).then(thumb=>{
    const date=new Date().toLocaleDateString(S.lang==="fr"?"fr-FR":"de-DE",{day:"2-digit",month:"short"});
    return vPut({id,name:file.name.replace(/\.[^.]+$/,""),blob:file,thumb,date,drillId:null});
  }).then(()=>mountVideos()).catch(()=>{ alert&&0; mountVideos(); });
}
function genThumb(file){
  return new Promise(res=>{
    try{
      const url=URL.createObjectURL(file); const vid=document.createElement("video");
      vid.preload="metadata"; vid.muted=true; vid.src=url;
      let done=false; const fin=(d)=>{ if(done)return; done=true; URL.revokeObjectURL(url); res(d); };
      vid.onloadeddata=()=>{ try{ vid.currentTime=Math.min(1,(vid.duration||2)/3); }catch(e){ fin(null);} };
      vid.onseeked=()=>{ try{ const cv=document.createElement("canvas"); const r=(vid.videoHeight/vid.videoWidth)||0.625;
        cv.width=320; cv.height=Math.round(320*r); cv.getContext("2d").drawImage(vid,0,0,cv.width,cv.height);
        fin(cv.toDataURL("image/jpeg",0.6)); }catch(e){ fin(null);} };
      vid.onerror=()=>fin(null); setTimeout(()=>fin(null),4000);
    }catch(e){ res(null); }
  });
}
function playVideo(id){
  vGet(id).then(rec=>{
    if(!rec){ return; }
    const url=URL.createObjectURL(rec.blob);
    const drills=allDrills().filter(d=>true);

/* ============================= MATCH & STATS ============================= */
const SHOTS=[["cd",{fr:"CD",de:"VH"}],["rev",{fr:"Revers",de:"RH"}],["serv",{fr:"Service",de:"Aufschlag"}],["vol",{fr:"Volée",de:"Volley"}],["smash",{fr:"Smash",de:"Smash"}]];
function gamePts(a,b){
  const nm=["0","15","30","40"];
  if(a>=3&&b>=3){ if(a===b)return "40-40"; return a>b?(S.lang==='fr'?"AV":"Vorteil")+" "+esc(S.player):(S.lang==='fr'?"AV":"Vorteil")+" "+esc(S.match.opp); }
  return nm[Math.min(a,3)]+" - "+nm[Math.min(b,3)];
}
function computeScore(m){
  const tgt=m.format==="super"?9:6, tbAt=m.format==="super"?8:6, need=m.format==="3"?2:1;
  let sets=[],setsWon=[0,0],g=[0,0],p=[0,0],inTB=false,tb=[0,0],server=m.server0,finished=false;
  for(const pt of m.log){
    if(finished)break; const w=pt.winner;
    if(inTB){ tb[w]++; if(tb[w]>=7&&tb[w]-tb[1-w]>=2){ g[w]++; sets.push([g[0],g[1]]); setsWon[w]++; g=[0,0];p=[0,0];inTB=false;tb=[0,0]; server=1-server; if(setsWon[w]>=need)finished=true; } }
    else { p[w]++; const a=p[w],b=p[1-w];
      if(a>=4&&a-b>=2){ g[w]++; p=[0,0]; server=1-server;
        if(g[w]>=tgt&&g[w]-g[1-w]>=2){ sets.push([g[0],g[1]]); setsWon[w]++; g=[0,0]; if(setsWon[w]>=need)finished=true; }
        else if(g[0]===tbAt&&g[1]===tbAt){ inTB=true; tb=[0,0]; } } }
  }
  let parts=sets.map(s=>s[0]+"-"+s[1]);
  if(!finished){ if(inTB)parts.push(g[0]+"-"+g[1]); else if(g[0]||g[1])parts.push(g[0]+"-"+g[1]); }
  const scoreline=parts.join("  ")||"0-0";
  const gameStr=inTB?`Tie-break ${tb[0]} - ${tb[1]}`:gamePts(p[0],p[1]);
  return {sets,setsWon,g,p,inTB,tb,server,finished,scoreline,gameStr};
}
function computeStats(m){
  const c={TW:0,TA:0,OE:0,OW:0,TUE:0,TDF:0}; const shotW={},shotE={};
  m.log.forEach(pt=>{ c[pt.r]=(c[pt.r]||0)+1;
    if(pt.shot){ if(pt.r==="TW"||pt.r==="TA"){shotW[pt.shot]=(shotW[pt.shot]||0)+1;} if(pt.r==="TUE"||pt.r==="TDF"){shotE[pt.shot]=(shotE[pt.shot]||0)+1;} } });
  const won=c.TW+c.TA+c.OE, lost=c.OW+c.TUE+c.TDF, total=m.log.length;
  return {...c,won,lost,total,pct:total?Math.round(won/total*100):0,
    tw:c.TW+c.TA, terr:c.TUE+c.TDF, ow:c.OW, oerr:c.OE, shotW, shotE};
}
function donutSVG(segs,size){
  const r=size/2-9, cx=size/2, cy=size/2, C=2*Math.PI*r;
  const tot=segs.reduce((a,s)=>a+s.v,0)||1; let off=0;
  let s=`<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">`;
  s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="12"/>`;
  segs.forEach(sg=>{ if(sg.v<=0)return; const len=C*sg.v/tot;
    s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${sg.c}" stroke-width="12" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})" stroke-linecap="butt"/>`;
    off+=len; });
  s+=`<text x="${cx}" y="${cy-2}" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-weight="700" font-size="${size*0.26}" fill="var(--fg)">${tot}</text>`;
  s+=`<text x="${cx}" y="${cy+size*0.16}" text-anchor="middle" font-size="${size*0.1}" fill="var(--muted)" font-family="Inter,sans-serif">pts</text></svg>`;
  return s;
}
function donutBlock(title,segs){
  let h=`<div class="bsec"><h3>${esc(title)}</h3><div class="donutwrap">${donutSVG(segs,120)}<div class="legend">`;
  segs.forEach(s=>{ h+=`<div class="lg"><span class="sw" style="background:${s.c}"></span>${esc(s.label)} <b style="margin-left:4px">${s.v}</b></div>`; });
  h+=`</div></div></div>`; return h;
}
function cmpBar(label,l,r){
  const tot=l+r||1;
  return `<div class="cmprow"><div class="ct"><span>${esc(label)}</span><span>${l} · ${r}</span></div>
    <div class="bar"><span class="bl" style="width:${l/tot*100}%"></span><span class="br" style="width:${r/tot*100}%"></span></div></div>`;
}

function matchStats(m,sc){
  S._statsMatch=m;
  const st=computeStats(m); const win=st.won>st.lost;
  let h=`<div class="view"><div class="bilan-hd"><div class="tro">${win?'🏆':'🎾'}</div>
    <h2>${esc(m.player)} vs ${esc(m.opp||t(T.opponent))}</h2><p>${esc(sc.scoreline)}</p></div>`;

  h+=`<div class="statgrid">
    <div class="stat2"><div class="v">${st.total}</div><div class="l">${esc(t(T.ptsPlayed))}</div></div>
    <div class="stat2"><div class="v">${st.pct}%</div><div class="l">${esc(t(T.winPct))}</div></div>
    <div class="stat2"><div class="v" style="color:var(--accent)">${st.tw}</div><div class="l">${esc(t(T.winners))} (${st.TA} ${esc(t(T.aces))})</div></div>
    <div class="stat2"><div class="v" style="color:var(--c-marc)">${st.terr}</div><div class="l">${esc(t(T.ue))} (+${st.TDF} ${esc(t(T.df))})</div></div></div>`;

  h+=donutBlock(t(T.howWon),[
    {v:st.TW,c:"#2f8f5b",label:t(T.winners)},
    {v:st.TA,c:"#1f7a4d",label:t(T.aces)},
    {v:st.OE,c:"#5a8f6f",label:t(T.oAdvErr)}]);
  h+=donutBlock(t(T.howLost),[
    {v:st.TUE,c:"#c0533f",label:t(T.ue)},
    {v:st.TDF,c:"#9c4636",label:t(T.df)},
    {v:st.OW,c:"#d9534b",label:t(T.oOppWinner)}]);

  // by shot
  const shotKeys=SHOTS.filter(([k])=>st.shotW[k]||st.shotE[k]);
  if(shotKeys.length){
    h+=`<div class="cmp"><div class="ct" style="font-weight:700;margin-bottom:8px">${esc(t(T.byShot))} — <span style="color:var(--accent)">${esc(t(T.winners))}</span> / <span style="color:var(--c-marc)">${esc(t(T.ue))}</span></div>`;
    shotKeys.forEach(([k,lab])=>{ h+=cmpBar(t(lab),st.shotW[k]||0,st.shotE[k]||0); });
    h+=`</div>`;
  }

  // vs opponent
  h+=`<div class="cmp"><div class="ct" style="font-weight:700;margin-bottom:4px">${esc(t(T.vsOpp))}</div>
    <div style="font-size:.72rem;color:var(--muted);margin-bottom:6px"><span style="color:var(--c-mv)">${esc(m.player)}</span> · <span style="color:var(--c-marc)">${esc(m.opp||t(T.opponent))}</span></div>`;
  h+=cmpBar(t(T.winners),st.tw,st.ow);
  h+=cmpBar(t(T.ue),st.terr,st.oerr);
  h+=cmpBar(t(T.ptsWon),st.won,st.lost);
  h+=`</div>`;

  const hasDeb=m.debrief&&Object.keys(m.debrief).length;
  h+=`<div class="navex"><button id="debriefBtn" style="flex:1">📝 ${esc(t(hasDeb?T.viewDebrief:T.openDebrief))}</button></div>`;
  if(!m.saved){
    h+=`<div class="navex"><button class="prim" id="saveMatchBtn" style="flex:1">${esc(t(T.saveMatch))} ✓</button></div>`;
  }
  h+=`<div class="navex"><button id="backMatchHome" style="flex:1">${esc(t(T.backHome))}</button></div></div>`;
  return h;
}

  const bs=$("#biblioSearch"); if(bs) bs.oninput=()=>{ S.biblioSearch=bs.value; render(); const el=$("#biblioSearch"); if(el){el.focus();const v=el.value;try{el.setSelectionRange(v.length,v.length);}catch(e){}} };

  const up=$("#undoPt"); if(up) up.onclick=()=>{ if(S.match&&S.match.log.length){ S.match.log.pop(); render(); } };
  const emb=$("#endMatchBtn"); if(emb) emb.onclick=confirmEndMatch;
  const svm=$("#saveMatchBtn"); if(svm) svm.onclick=saveMatch;
  const bmh=$("#backMatchHome"); if(bmh) bmh.onclick=()=>{ if(S.view==="matchdetail"){ S.progTab="match"; go("prog"); } else go("home"); };

    S.player=b.dataset.player; LS.set("player",S.player); render();
  });
  const add=$("#addPlayer"); if(add) add.onclick=openAddPlayer;

  // session runner controls
  const ex=$("#exitSession"); if(ex) ex.onclick=()=>{ if(S.run){clearInterval(S.run._t);} S.run=null; S.session=null; go("home"); };
  const pe=$("#prevEx"); if(pe) pe.onclick=()=>{ if(S.exIdx>0){S.exIdx--; pauseKeep(); render();} };
  const ne=$("#nextEx"); if(ne) ne.onclick=()=>{ if(S.exIdx<S.session.ex.length-1){S.exIdx++; pauseKeep(); render();} };
  const fin=$("#finishSession"); if(fin) fin.onclick=confirmFinish;

  const hb=$("#homeBilan"); if(hb) hb.onclick=()=>{S.run=null;S.session=null;go("home");};

  // fab
  $("#fab").onclick=openFaultSheet;

function pauseKeep(){ /* keep timer running across exercises; nothing to reset */ }

function chScore(d){

  S.session=SESSIONS[i]; S.exIdx=0;

}
