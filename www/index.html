  const inp=$("#pname"); inp.focus();
  $("#pSave").onclick=()=>{
    const v=inp.value.trim(); if(!v){closeModal();return;}
    if(!S.players.includes(v)) S.players.push(v);
    S.player=v; LS.set("players",S.players); LS.set("player",v); closeModal(); render();
  };
  $("#pCancel").onclick=closeModal;
  inp.onkeydown=(e)=>{ if(e.key==="Enter") $("#pSave").click(); };
}

function openFaultSheet(){
  let h=`<h3>${esc(t(T.faultTitle))}</h3><div class="sub">${esc(t(T.faultSub))}</div><div class="faultgrid">`;
  DEFIS.forEach((d,i)=>{
    h+=`<button class="faultbtn" data-f="${i}" style="border-left-color:${d.color}">
      <div class="ft" style="color:${d.color}">${esc(t(d.label))}</div>
      <div class="fd">${esc(t(d.trig))}</div>
      <div class="fc">→ ${esc(t(d.res))}</div></button>`;
  });
  h+=`</div><button class="btn-ghost" id="fClose" style="margin-top:14px">${esc(t(T.close))}</button>`;
  sheet(h);
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>showDefi(+b.dataset.f,true));
  $("#fClose").onclick=closeModal;
}

let _lastPool=-1;
function pickPool(d){
  const arr=d.pool[S.lang]; let i=Math.floor(Math.random()*arr.length);
  if(arr.length>1 && i===_lastPool) i=(i+1)%arr.length;
  _lastPool=i; return {i,txt:arr[i]};
}
function showDefi(idx,logIt){
  const d=DEFIS[idx];
  let picked=null;
  if(!d.fixed) picked=pickPool(d);
  function body(){
    let h=`<div class="defi-res">
      <div class="cat" style="color:${d.color}">${esc(t(d.label))}</div>
      <div class="big">${esc(t(d.res))}</div>`;
    if(d.fixed){
      h+=`<div class="how">${esc(t(d.how))}</div>`;
    } else {
      h+=`<div class="varied">${esc(t(T.variedNote))}</div>
          <div class="how" style="text-align:center;font-family:var(--disp);font-weight:700;font-size:1.05rem">${esc(picked.txt)}</div>
          <button class="reroll" id="reroll">⟳ ${esc(t(T.reroll))}</button>`;
    }
    if(logIt) h+=`<button class="btn-wide" id="logBtn" style="background:${d.color}">${esc(t(T.logFault))}</button>`;
    h+=`<button class="btn-ghost" id="dClose">${esc(t(T.close))}</button></div>`;
    return h;
  }
  sheet(body());
  const rr=$("#reroll"); if(rr) rr.onclick=()=>{ picked=pickPool(d); $("#modalRoot .sheet").innerHTML=`<div class="grip"></div>`+body(); rebind(); };
  function rebind(){
    const rr2=$("#reroll"); if(rr2) rr2.onclick=()=>{ picked=pickPool(d); $("#modalRoot .sheet").innerHTML=`<div class="grip"></div>`+body(); rebind(); };
    const lb=$("#logBtn"); if(lb) lb.onclick=()=>{ S.run.faults[d.key]=(S.run.faults[d.key]||0)+1; closeModal(); };
    const dc=$("#dClose"); if(dc) dc.onclick=closeModal;
  }
  rebind();
}

function confirmFinish(){
  sheet(`<h3>${esc(t(T.confirmFinish))}</h3>
    <button class="btn-wide" id="cfYes">${esc(t(T.yes))} ✓</button>
    <button class="btn-ghost" id="cfNo">${esc(t(T.keepGoing))}</button>`);
  $("#cfYes").onclick=()=>{ if(S.run){clearInterval(S.run._t);S.run.timing=false;} closeModal(); go("bilan"); };
  $("#cfNo").onclick=closeModal;
}
function saveBilan(){
  const r=S.run, s=S.session;
  const now=new Date();
  const date=now.toLocaleDateString(S.lang==="fr"?"fr-FR":"de-DE",{day:"2-digit",month:"short",year:"numeric"});
  S.history.push({player:S.player,sid:s.id,date,dur:r.elapsed,faults:{...r.faults},scores:{...r.scores}});
  LS.set("history",S.history);
  S.run=null; S.session=null; go("prog");
}

/* ---- drills/match helpers ---- */
function rerenderDrills(){ render(); const el=$("#drillSearch"); if(el){ el.focus(); const v=el.value; try{el.setSelectionRange(v.length,v.length);}catch(e){} } }
function toggleFav(id){ const i=S.favorites.indexOf(id); if(i<0)S.favorites.push(id); else S.favorites.splice(i,1); LS.set("favorites",S.favorites); render(); }

function startMatch(){
  const opp=($("#oppName")&&$("#oppName").value.trim())||t(T.opponent);
  const fmtEl=document.querySelector("[data-fmt].on"), servEl=document.querySelector("[data-serv].on");
  const format=fmtEl?fmtEl.dataset.fmt:"1"; const server0=servEl?+servEl.dataset.serv:0;
  S.match={player:S.player,opp,format,server0,log:[],done:false,saved:false};
  S.matchShot=null; render();
}
function recordPoint(reason){
  if(!S.match||S.match.done) return;
  const winner=(reason==="TW"||reason==="TA"||reason==="OE")?0:1;
  S.match.log.push({r:reason,shot:S.matchShot,winner});
  S.matchShot=null; render();
}
function confirmEndMatch(){
  sheet(`<h3>${esc(t(T.confirmEnd))}</h3>
    <button class="btn-wide" id="ceYes">${esc(t(T.yes))} ✓</button>
    <button class="btn-ghost" id="ceNo">${esc(t(T.keepGoing))}</button>`);
  $("#ceYes").onclick=()=>{ S.match.done=true; closeModal(); render(); };
  $("#ceNo").onclick=closeModal;
}
function saveMatch(){
  const m=S.match; const sc=computeScore(m); const st=computeStats(m);
  const date=new Date().toLocaleDateString(S.lang==="fr"?"fr-FR":"de-DE",{day:"2-digit",month:"short",year:"numeric"});
  S.matchHist.push({player:m.player,opp:m.opp,format:m.format,server0:m.server0,log:m.log,
    date,win:st.won>st.lost,scoreline:sc.scoreline,stats:{tw:st.tw,tue:st.terr},debrief:m.debrief||{},saved:true});
  LS.set("matchHist",S.matchHist);
  S.match=null; S.progTab="match"; go("prog");
}

/* ============================= INIT ============================= */
$("#themeBtn").textContent=S.theme==="light"?"☀":S.theme==="dark"?"☾":"◐";
render();
bgInit();
</script>

</body>
</html>
